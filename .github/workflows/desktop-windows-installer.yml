name: Windows installer - verify and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package-lock.json'
      - 'electron/**'
      - 'tests/desktop-auto-update.test.cjs'
      - 'src/sync-next/desktopSqliteMirror.ts'
      - 'src/sync-next/installDesktopNetworkBridge.ts'
      - 'src/sync-next/posAttemptStore.ts'
      - 'src/components/DesktopDownloadButton.tsx'
      - 'src/components/DesktopStorageStatus.tsx'
      - 'src/components/PWAInstallButton.tsx'
      - 'src/components/Navbar.tsx'
      - 'src/components/LoginView.tsx'
      - 'src/main.tsx'
      - 'src/sync-next/localDb.ts'
      - 'tests/desktop-storage.test.cjs'
      - 'tests/desktop-sqlite-mirror.test.ts'
      - 'tests/desktop-install-ui.test.mjs'
      - 'scripts/assert-desktop-build-env.cjs'
      - 'scripts/check-packaged-sqlite.cjs'
      - 'scripts/smoke-original-print-pdf.mjs'
      - 'scripts/smoke-windows-update-handoff.cjs'
      - 'package.json'
      - '.github/workflows/desktop-windows-installer.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: lobnanprint-windows-desktop-v1.1.0
  cancel-in-progress: true

jobs:
  verify-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out approved main revision
        uses: actions/checkout@v4
      - name: Install Node.js 24 for native SQLite
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application build dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript safety check
        run: npm run lint
      - name: Test pinned database identity and Windows local storage
        run: node --test tests/desktop-storage.test.cjs
      - name: Test desktop mirror and existing browser financial storage
        run: node --import tsx --test tests/desktop-sqlite-mirror.test.ts tests/pos-attempt-indexeddb.test.ts
      - name: Test SHA256-verified unattended updates and strict next-start install guard
        run: node --test tests/desktop-auto-update.test.cjs
      - name: Verify actual Electron to PowerShell installer handoff and automatic reopen
        run: node scripts/smoke-windows-update-handoff.cjs
      - name: Test native and browser install actions and SQLite status control
        run: node --test tests/desktop-install-ui.test.mjs
      - name: Verify original print PDF paper orientation and isolation before publication
        run: node scripts/smoke-original-print-pdf.mjs
      - name: Stamp unique desktop version for this successful build
        shell: pwsh
        run: |
          npm version "1.1.$env:GITHUB_RUN_NUMBER" --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_VERSION_STAMP_FAILED' }
      - name: Build verified Windows installer
        run: npm run build:exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_SYNC_LOGIN_MODE: 'users'
          VITE_SYNC_BACKEND: 'local-postgres'
          VITE_PUBLIC_SYNC_API_URL: 'https://lobnan-api.shares.zrok.io'
      - name: Verify SQLite persistence and packaged application assets
        shell: pwsh
        run: |
          node scripts/check-packaged-sqlite.cjs
          if ($LASTEXITCODE -ne 0) { throw 'SQLITE_PERSISTENCE_CHECK_FAILED' }
          if (!(Test-Path 'dist-electron/win-unpacked/LobnanPrint.exe')) {
            throw 'WINDOWS_APPLICATION_EXECUTABLE_MISSING'
          }
          if (!(Test-Path 'dist-electron/win-unpacked/resources/app.asar')) {
            throw 'WINDOWS_APPLICATION_BUNDLE_MISSING'
          }
          Write-Host 'SQLITE_TESTED_APPLICATION_PACKAGE_PRESENT'
      - name: Validate installer before publication
        shell: pwsh
        run: |
          $expected = "LobnanPrint-Setup-1.1.$env:GITHUB_RUN_NUMBER.exe"
          $files = @(Get-ChildItem 'dist-electron' -Filter $expected -File)
          if ($files.Count -ne 1) { throw "Expected one verified installer, found $($files.Count)" }
          if ($files[0].Length -lt 50000000) { throw 'Windows installer size too small' }
          Get-FileHash -Path $files[0].FullName -Algorithm SHA256 | Format-List
          $blockmap = "dist-electron/$expected.blockmap"
          $manifest = "dist-electron/latest.yml"
          if (!(Test-Path $blockmap) -or !(Test-Path $manifest)) { throw 'DIFFERENTIAL_RELEASE_FILES_MISSING' }
          if ((Get-Item $blockmap).Length -le 0) { throw 'EMPTY_BLOCKMAP' }
          if (!(Test-Path 'dist-electron/win-unpacked/resources/app-update.yml')) { throw 'UPDATER_CONFIG_MISSING' }
          node -e "if(require('electron-updater/package.json').version !== '6.8.10') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'UPDATER_DEPENDENCY_MISSING' }
          $yaml = Get-Content $manifest -Raw
          $hash = [Convert]::ToBase64String([byte[]]([regex]::Matches((Get-FileHash $files[0].FullName -Algorithm SHA512).Hash, '..') | ForEach-Object { [Convert]::ToByte($_.Value,16) }))
          if (!$yaml.Contains($expected) -or !$yaml.Contains($hash)) { throw 'MANIFEST_INSTALLER_HASH_MISMATCH' }
      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LobnanPrint-Windows-${{ github.run_number }}
          path: |
            dist-electron/LobnanPrint-Setup-*.exe
            dist-electron/LobnanPrint-Setup-*.exe.blockmap
            dist-electron/latest.yml
          if-no-files-found: error
      - name: Publish official download only after every successful check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          $tag = "desktop-v$version"
          $installer = "dist-electron/LobnanPrint-Setup-$version.exe"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host 'An official release already exists. Leaving the immutable installer unchanged.'
            exit 0
          }
          gh release create $tag $installer "$installer.blockmap" 'dist-electron/latest.yml' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "مطبعة ومكتبة لبنان - Windows v$version" --notes 'Windows installer and differential blockmap. Pinned SQLite database and unchanged browser storage.'
          if ($LASTEXITCODE -ne 0) { throw 'OFFICIAL_DESKTOP_RELEASE_FAILED' }
      - name: Record desktop release outcome on exact commit
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOB_RESULT: ${{ job.status }}
        run: |
          $state = if ($env:RELEASE_JOB_RESULT -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'Windows installer passed checks and release publication' } else { 'Windows installer build or release failed; check Actions logs' }
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=$state -f context=lobnan-windows-installer -f description=$description
