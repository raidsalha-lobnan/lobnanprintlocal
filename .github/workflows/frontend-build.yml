name: Frontend build smoke test
on:
  push:
    branches: [main, setup/postgres-offline-review]
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source layout
        run: npm run verify:clean
      - name: Verify saved users login regression cases
        run: node --experimental-strip-types --test tests/saved-users-login.test.mjs tests/postgres-only-entrypoints.test.mjs
      - name: Check TypeScript and accounting regression tests
        run: npm run lint && npm test
      - name: Build application
        run: npm run build
        env:
          VITE_SYNC_BACKEND: local-postgres
