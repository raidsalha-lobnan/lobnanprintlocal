name: Frontend build smoke test
on:
  push:
    branches: [setup/postgres-offline-review]
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile in CI for legacy dependency mismatch
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source layout
        run: npm run verify:clean
      - name: Build application
        run: npm run build
        env:
          VITE_SYNC_BACKEND: local-postgres
      - name: Commit refreshed lockfile on development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/postgres-offline-review'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize package-lock.json with dependencies'
            git push
          fi
