name: Secure PostgreSQL authentication checks
on:
  push:
    branches: [feature/secure-postgres-login]
  pull_request:
    paths:
      - 'local-server/**'
      - 'src/components/LoginView.tsx'
      - 'src/services/secureAuth.ts'
      - 'src/sync-next/httpTransport.ts'
      - '.github/workflows/secure-postgres-auth.yml'
permissions:
  contents: read
jobs:
  security-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check every critical server module
        run: |
          node --check local-server/user-auth.mjs
          node --check local-server/server.mjs
          node --check local-server/import-users.mjs
          node --check local-server/access-policy.mjs
          node --check local-server/legacy-snapshot.mjs
          node --check local-server/import-legacy-snapshot.mjs
      - name: Verify salted login and server-side authorization
        run: node --test local-server/tests/user-auth.test.mjs local-server/tests/access-policy.test.mjs local-server/tests/snapshot-import.test.mjs

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lobnan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lobnan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:test-only-password@127.0.0.1:5432/lobnan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private API dependencies
        run: npm install --prefix local-server --no-audit --no-fund
      - name: Verify real PostgreSQL sign-in, CORS and invoice writes
        run: node --test local-server/tests/auth-postgres-integration.test.mjs
