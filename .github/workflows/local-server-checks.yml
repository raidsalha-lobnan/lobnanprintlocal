name: Local Sync API Checks
on:
  push:
    paths:
      - 'local-server/**'
      - 'docker-compose.*.yml'
      - '.github/workflows/local-server-checks.yml'
  pull_request:
    paths:
      - 'local-server/**'
      - 'docker-compose.*.yml'
      - '.github/workflows/local-server-checks.yml'
jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install private API dependencies for the full server suite
        run: npm install --prefix local-server --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Syntax-check the private server and new audit engine
        run: |
          node --check local-server/server.mjs
          node --check local-server/sync-domain.mjs
          node --check local-server/sync-service.mjs
          node --check local-server/operational-health-audit.mjs
      - name: Run every isolated server regression test
        run: |
          find local-server/tests -maxdepth 1 -name '*.test.mjs' \
            ! -name 'integration.postgres.test.mjs' \
            ! -name 'auth-postgres-integration.test.mjs' -print0 |
            xargs -0 node --test
      - run: docker compose --env-file .env.local-server.example -f docker-compose.local.yml config -q
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://ci:ci_only_test_password@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: local-server
      - run: node --test tests/integration.postgres.test.mjs
        working-directory: local-server
